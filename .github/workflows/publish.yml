name: Publish

on:
  push:
    tags:
      # Strict vMAJOR.MINOR.PATCH only — not the looser `v*`, which would
      # also match stray/non-release tags and hand them straight to a
      # publish gate. This is what `npm version <bump>` produces by default.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22" # engines floor
          cache: npm

      - name: Install
        run: npm ci

      # The tag is authoritative for the version — package.json's committed
      # version is not bumped as part of a release. `--no-git-tag-version`
      # means this only rewrites the working tree's package.json (and
      # package-lock.json's top-level version field): no commit, no push,
      # nothing leaves this checkout. Runs before the gate so everything
      # after this, including what the packaging suite packs and consumes,
      # sees the real version — the same version `publish` will derive
      # independently from the same tag.
      - name: Set package.json version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit, mocked-provider and automation tests
        run: npm test

      - name: Build (dual ESM/CJS)
        run: npm run build

      - name: Packaging suite
        run: npm run test:package

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write # to create the GitHub Release
      id-token: write # for npm provenance

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      # Fresh checkout, fresh working tree — this job re-derives the version
      # from the tag itself rather than inheriting anything from `test`.
      - name: Set package.json version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # `npm publish` re-runs `prepublishOnly` (check+test+test:package)
      # itself as a redundant safety net — `needs: test` above is what
      # actually gates whether this job runs at all.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
