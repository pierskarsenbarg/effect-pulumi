name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are worth cancelling; pushes to main are not — each one
  # is a distinct commit whose result should be recorded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        # 22 is the floor declared in engines — @pulumi/pulumi requires it.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # PRs install rather than `npm ci` so Dependabot's PRs run cleanly even
      # when the lockfile it produces needs reconciling. Pushes to main keep
      # `npm ci` so what lands is built from the exact locked tree.
      - name: Install (PR)
        if: github.event_name == 'pull_request'
        run: npm install

      - name: Install (main)
        if: github.event_name != 'pull_request'
        run: npm ci

      - name: Type-check (src, examples and tests)
        run: npm run typecheck

      - name: Unit, mocked-provider and automation tests
        run: npm test

      - name: Build (dual ESM/CJS)
        run: npm run build

      # Packs a real tarball and consumes it from both an ESM and a CJS
      # project, so it is worth running on every Node version rather than once.
      - name: Packaging suite
        run: npm run test:package
