name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are worth cancelling; pushes to main are not — each one
  # is a distinct commit whose result should be recorded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        # 22 is the floor declared in engines — @pulumi/pulumi requires it.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check (src, examples and tests)
        run: npm run typecheck

      # oxlint and oxfmt are native binaries whose behaviour does not vary with
      # the Node version, so this is redundant across the matrix — it stays in
      # the same job anyway rather than costing a second checkout and install.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit, mocked-provider and automation tests
        run: npm test

      - name: Build (dual ESM/CJS)
        run: npm run build

      # Packs a real tarball and consumes it from both an ESM and a CJS
      # project, so it is worth running on every Node version rather than once.
      - name: Packaging suite
        run: npm run test:package
