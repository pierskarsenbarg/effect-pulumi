version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - pierskarsenbarg
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
      - dependency-name: "typescript"
        versions: [">=7.0.0"] # Skip version 7 and above

    groups:
      # @pulumi/aws is regenerated from the AWS provider constantly (often
      # several releases a week), so ungrouped these would dominate the PR
      # queue on their own.
      pulumi:
        patterns:
          - "@pulumi/*"
        update-types:
          - minor
          - patch

      # These three are peer-coupled: @effect/vitest pins both `effect` and
      # `vitest` in its peerDependencies, so bumping any one of them alone
      # can leave the tree unsatisfiable. Keep them in a single PR.
      effect:
        patterns:
          - "effect"
          - "@effect/*"
          - "vitest"
        update-types:
          - minor
          - patch

    # Majors are deliberately left out of the groups above so each one
    # arrives as its own PR - a @pulumi/aws or vitest major is a real
    # migration, not something to review alongside routine patches.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    labels:
      - dependencies
    assignees:
      - pierskarsenbarg
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
